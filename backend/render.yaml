services:
  - type: web
    name: cv-insight-ai-backend
    runtime: node
    plan: starter
    region: oregon
    buildCommand: npm install && npx prisma generate
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false # Set via Render Dashboard using your Neon PostgreSQL connection string
      - key: JWT_SECRET
        generateValue: true
      - key: COOKIE_SECRET
        generateValue: true
      - key: CLIENT_ORIGIN
        value: https://cv-insight-ai.vercel.app
      - key: GEMINI_API_KEY
        sync: false # Set via Render Dashboard
